# finetune_onsets_frames run config, built from configs/ by src/launch/make_run_config.py
transcribe:
  onsets_frames:
    checkpoint_path: storage/weights/onsets_frames_maestro/model-500000.pt
    checkpoint_md5: 5cdfbfc3cd1d1298a2891640baf6fa68
    finetuned_weights_path: null
    model_complexity: 48
    sample_rate: 16000
    hop_length: 512
    window_length: 2048
    mel_bands: 229
    mel_min_hz: 30
    mel_max_hz: 8000
    min_midi: 21
    max_midi: 108
    lstm_inference_chunk_frames: 512
    onset_threshold: 0.5
    frame_threshold: 0.5
    onset_time: peak_interp
  onsets_frames_training:
    seed: 42
    onset_label_frames: 1
    offset_label_frames: 1
    batch_size: 8
    segment_frames: 640
    learning_rate: 0.0001
    learning_rate_decay_steps: 10000
    learning_rate_decay_rate: 0.5
    clip_gradient_norm: 3.0
    loss_weights:
      onset: 1.0
      offset: 1.0
      frame: 1.0
    max_steps: 300
    validate_every_steps: 100
    patience: 5
    log_every_steps: 50
    augmentation:
      enabled: true
      tuning_cents: 30
      semitone_shift_max: 2
      semitone_shift_probability: 0.5
      gain_db: 6.0
      tilt_db_per_octave: 3.0
evaluate:
  transcription:
    onset_tolerance_seconds: 0.05
    pitch_tolerance_cents: 50.0
    offset_ratio: 0.2
    lenient_onset_tolerance_seconds: 0.1
    tuning_gate_cents: 25.0
datasets:
  answer_keys:
    grace_window_seconds_before: 0.05
    grace_window_seconds_after: 0.18
  separation:
    metadata_csv: data/gugak_ensemble_71955/metadata.csv
    ingest_dir: data/gugak_ensemble_71955/ingest
    eval_manifest: manifests/separation/eval_manifest.parquet
    source_manifest: manifests/separation/source_manifest_v2.parquet
    jeongak_songs:
      genre_major: 정악
    pick_stems:
      genre_major: 민속악
      genre_subs:
      - 산조
      - 대풍류
      instruments:
      - daegeum
      - piri
      - haegeum
      - ajaeng
      - gayageum
      - geomungo
  instruments:
    english_names:
      대금: daegeum
      피리: piri
      해금: haegeum
      아쟁: ajaeng
      가야금: gayageum
      거문고: geomungo
run:
  artifacts_dir: storage/experiments/exp016_261119_augmentation_semitone_shifts/smoke
  device: cuda
  num_workers: 16
  limit_items: 6
  train_splits:
  - train
  validation_splits:
  - val
  train_datasets:
  - six_dragon
  - solo
  validation_datasets:
  - six_dragon
  - solo
  selection_metric: onset_f1_masked
  validation_onset_threshold: 0.15
  six_dragon:
    quality_table: storage/experiments/exp001_261022_strand_a_pilot/tables/alignment_quality_by_song.parquet
    match_table: storage/experiments/exp001_261022_strand_a_pilot/tables/match_table.parquet
    midi_dir: storage/experiments/exp001_261022_strand_a_pilot/aligned_midi/per_stem
    aligned_cache_dir: storage/experiments/exp001_261022_strand_a_pilot/cache/aligned
  solo_split:
    table: storage/experiments/exp012_261118_solo_finetune/tables/solo_split.parquet
  audio_cache_dir: storage/cache/audio_mono_16k
  weights_dir: storage/experiments/exp016_261119_augmentation_semitone_shifts/smoke/weights
  tables_dir: storage/experiments/exp016_261119_augmentation_semitone_shifts/smoke/tables
  limit_items_per_answer_key: 6
