# audit_solo_midi run config, built from configs/ by src/launch/make_run_config.py
datasets:
  solo:
    source_manifest: manifests/separation/source_manifest_v2.parquet
    labels_dir: data/gugak_solo_71470/labels
    midi_dir: data/gugak_solo_71470/midi
    genre_codes: null
    instruments:
    - daegeum
    - piri
    - haegeum
    - ajaeng
    - gayageum
    - geomungo
    dev_fraction: 0.3
    seed: 42
  instruments:
    english_names:
      대금: daegeum
      피리: piri
      해금: haegeum
      아쟁: ajaeng
      가야금: gayageum
      거문고: geomungo
features:
  f0:
    pesto:
      checkpoint: mir-1k_g7
      reduction: alwa
      model_sample_rate: 44100
      hop_seconds: 0.01
      device: cuda
  onsets:
    spectral_flux:
      window: 2048
      hop_seconds: 0.01
      median_seconds: 0.5
      delta: 0.05
      min_gap_seconds: 0.05
    energy:
      rise_db: 4.5
      rise_window_seconds: 0.04
      min_inter_onset_seconds: 0.08
evaluate:
  f0:
    note_core_fraction:
    - 0.2
    - 0.8
    min_note_seconds: 0.15
    pitch_tolerance_cents: 50.0
    shift_semitones:
    - -1
    - 0
    - 1
  label_timing:
    shift_range_seconds:
    - -0.3
    - 0.3
    pitch_tolerance_cents: 50.0
    pitch_reference:
      note_core_fraction:
      - 0.0
      - 1.0
      min_note_seconds: 0.0
    window_seconds: 30.0
    min_window_scored_seconds: 5.0
    min_window_pitch_changes: 10
    onset_tolerance_seconds: 0.025
    onset_instruments:
    - gayageum
    - geomungo
run:
  artifacts_dir: storage/experiments/exp010_261117_solo_midi_audit/smoke
  f0_tracker: pesto
  onset_sample_rate: 22050
  limit_clips_per_instrument: 3
  summary_timing_limit_seconds: 0.05
  f0_dir: storage/experiments/exp010_261117_solo_midi_audit/smoke/f0
  tables_dir: storage/experiments/exp010_261117_solo_midi_audit/smoke/tables
