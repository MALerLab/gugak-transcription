# write_listening run config, built from configs/ by src/launch/make_run_config.py
datasets:
  separation:
    metadata_csv: data/gugak_ensemble_71955/metadata.csv
    ingest_dir: data/gugak_ensemble_71955/ingest
    eval_manifest: manifests/separation/eval_manifest.parquet
    source_manifest: manifests/separation/source_manifest_v2.parquet
    jeongak_songs:
      genre_major: 정악
    pick_stems:
      genre_major: 민속악
      genre_subs:
      - 산조
      - 대풍류
      instruments:
      - daegeum
      - piri
      - haegeum
      - ajaeng
      - gayageum
      - geomungo
  instruments:
    english_names:
      대금: daegeum
      피리: piri
      해금: haegeum
      아쟁: ajaeng
      가야금: gayageum
      거문고: geomungo
notes:
  midi:
    score_velocity: 80
    gm_programs:
      daegeum: 77
      piri: 111
      haegeum: 110
      ajaeng: 42
      gayageum: 107
      geomungo: 106
    pitch_bend_range_semitones: 12
    pitch_bend_min_step_cents: 3.0
render:
  render:
    soundfont: ~/storage/gugak-transcription/soundfonts/MuseScore_General.sf2
    sample_rate: 44100
    fluidsynth_gain: 0.6
    layer_render_to_real_rms: 0.8
    peak_ceiling: 0.95
    target_rms: 0.1
    layer_pan: 0.35
    layer_peak_ceiling: 0.95
run:
  artifacts_dir: storage/experiments/exp001_261022_strand_a_pilot
  cache_dir: storage/experiments/exp001_261022_strand_a_pilot/cache
  tables_dir: storage/experiments/exp001_261022_strand_a_pilot/tables
  aligned_midi_dir: storage/experiments/exp001_261022_strand_a_pilot/aligned_midi
  listening_dir: storage/experiments/exp001_261022_strand_a_pilot/listening
  clip_seconds: 30
  clips:
  - name: 01_ensemble_hyeonak_sangnyeongsan
    song_id: 0009_정악_풍류음악
    parts: all
    method: per_song
    with_unaligned: true
  - name: 02_gayageum_gagok_urong
    song_id: 0069_정악_풍류음악
    parts:
    - gayageum
    method: per_song
  - name: 03_piri_sujecheon
    song_id: 0140_정악_궁중음악
    parts:
    - piri
    method: per_song
  - name: 04_ajaeng_yeominlak
    song_id: 0130_정악_궁중음악
    parts:
    - ajaeng
    method: per_song
  - name: 05_daegeum_gunak_fast
    song_id: 0063_정악_풍류음악
    parts:
    - daegeum
    method: per_song
  - name: 06_geomungo_gyemyeon_garakdodeuri
    song_id: 0046_정악_풍류음악
    parts:
    - geomungo
    method: per_song
  - name: 07_haegeum_bohoeja_transposed
    song_id: 0123_정악_궁중음악
    parts:
    - haegeum
    method: per_song
  - name: 08_worst_gwanak_jungnyeongsan
    song_id: 0014_정악_풍류음악
    parts: all
    method: per_song
