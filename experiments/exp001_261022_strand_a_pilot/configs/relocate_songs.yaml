# relocate_songs run config, built from configs/ by src/launch/make_run_config.py
datasets:
  separation:
    metadata_csv: data/gugak_ensemble_71955/metadata.csv
    ingest_dir: data/gugak_ensemble_71955/ingest
    eval_manifest: manifests/separation/eval_manifest.parquet
    source_manifest: manifests/separation/source_manifest_v2.parquet
    jeongak_songs:
      genre_major: 정악
    pick_stems:
      genre_major: 민속악
      genre_subs:
      - 산조
      - 대풍류
      instruments:
      - daegeum
      - piri
      - haegeum
      - ajaeng
      - gayageum
      - geomungo
  instruments:
    english_names:
      대금: daegeum
      피리: piri
      해금: haegeum
      아쟁: ajaeng
      가야금: gayageum
      거문고: geomungo
  six_dragon:
    musicxml_dir: data/jeongganbo_musicxml
    part_names:
    - daegeum
    - piri
    - haegeum
    - ajaeng
    - gayageum
    - geomungo
align:
  warp:
    refine_feature_rate: 10
    refine_cens_smooth_frames: 11
    refine_cens_downsample: 1
    refine_pad_quarters: 12
    refine_tempo_factors:
    - 0.85
    - 0.92
    - 1.0
    - 1.08
    - 1.17
    feature_rate: 50
    step_weights:
    - 1.5
    - 1.5
    - 2.0
    threshold_rec: 1000000
    alpha: 0.5
run:
  artifacts_dir: storage/experiments/exp001_261022_strand_a_pilot
  tables_dir: storage/experiments/exp001_261022_strand_a_pilot/tables
  groups:
  - name: 관악영산회상 상령산 1–4장
    songs:
    - 0001_정악_풍류음악
    - 0002_정악_풍류음악
    - 0003_정악_풍류음악
    - 0004_정악_풍류음악
    anchor: both
  - name: 관악영산회상 중령산 1–5장
    songs:
    - 0013_정악_풍류음악
    - 0014_정악_풍류음악
    - 0015_정악_풍류음악
    - 0016_정악_풍류음악
    - 0017_정악_풍류음악
    anchor: both
  readmit:
  - 0021_정악_풍류음악
