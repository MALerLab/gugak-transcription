# Solo dataset (AI Hub 71470) clips used as strand B's answer key, used by src/datasets/solo.py
source_manifest: manifests/separation/source_manifest_v2.parquet
labels_dir: data/gugak_solo_71470/labels
midi_dir: data/gugak_solo_71470/midi
# Solo genre codes for 민속악 instrumental music (inferred from piece names, the dataset ships no code table):
# F01 = 민속 풍류 (서도풍류, 취타풍류), F02 = 산조, F03 = 시나위
genre_codes: [F01, F02, F03]   # null = every genre
# Same melodic instruments as the separation-dataset pick
instruments: [daegeum, piri, haegeum, ajaeng, gayageum, geomungo]
# Pieces (not clips) go to dev or test, so no piece is in both.
# dev tunes the segmentation parameters; test is scored once with the chosen ones.
dev_fraction: 0.3
seed: 42                 # exp002 used 0 (its run config keeps it)
# Clips whose MIDI looks unreliable against their own audio, left out of solo scoring and training (Jae, exp011).
# Read from exp010's audit (rows with judge == pitch); clips with no checkable notes (NaN gap) stay in.
unreliable_midi:
  audit_table: storage/experiments/exp010_261117_solo_midi_audit/tables/items.parquet
  max_abs_semitone_gap: 0          # any whole-semitone gap (±1, octaves, other) drops the clip
  min_agreement_after_gap: 0.5     # on pitch, but written and heard pitch agree on under half the note middles
# Training split (exp012 on): test = exp002's test clips, unchanged; every other clip of the instruments above,
# any genre, split by piece into train / val. No clip of a test piece goes into train or val.
# Unreliable clips (above) keep their split with a drop_reason: training skips them, scoring marks them.
training_split:
  test_clips_table: storage/experiments/exp002_261022_strand_b_pilot/tables/solo_clips.parquet
  test_partition: test
  genre_codes: null            # every genre
  val_fraction: 0.1            # per instrument: share of its kept non-test clips that val aims for (whole pieces)
  val_overshoot: 1.5           # a piece can't push any instrument's val past this × its share
  seed: 42
