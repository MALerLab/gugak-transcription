# Run recipe for src/pipelines/audit_solo_midi.py
# uses: module recipes merged in (configs/<path>.yaml) · run: this command's own settings
# overrides: changes to the module recipes for this command
# src/launch/make_run_config.py turns this into experiments/<exp>/configs/<name>.yaml; the run reads only that.
uses: [datasets/solo, datasets/instruments, features/f0/pesto, features/onsets, evaluate/f0, evaluate/label_timing]
run:
  artifacts_dir: ???
  f0_tracker: pesto                     # stock PESTO (2026-11-13 decision)
  onset_sample_rate: 22050              # spectral-flux onsets at exp006's rate
  limit_clips_per_instrument: 0         # >0: only the first N clips per instrument (smoke test); 0 = all
  summary_timing_limit_seconds: 0.05    # summary counts clips whose best shift is further off than this
  f0_dir: ${run.artifacts_dir}/f0
  tables_dir: ${run.artifacts_dir}/tables
overrides:
  datasets/solo:
    genre_codes: null                   # every genre: the audit checks the whole dataset for the six instruments
