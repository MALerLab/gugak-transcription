# Run recipe for src/pipelines/pseudo_label_stems.py
# uses: module recipes merged in (configs/<path>.yaml) · run: this command's own settings
# overrides: changes to the module recipes for this command
# src/launch/make_run_config.py turns this into experiments/<exp>/configs/<name>.yaml; the run reads only that.
uses: [transcribe/onsets_frames, notes/midi]
run:
  artifacts_dir: ???
  device: cuda                    # pick the GPU with CUDA_VISIBLE_DEVICES at launch
  stems_table: ???                # a pick_stems table (strand B's: exp002's picked_stems.parquet)
  splits: [train]                 # frozen-split names to pseudo-label; never val or test
  onset_thresholds_table: ???     # the teacher's per-instrument onset thresholds (tune_onsets_frames_thresholds)
  audio_cache_dir: ???            # mono 16 kHz .npy per item, shared across runs
  midi_dir: ${run.artifacts_dir}/pseudo_midi
  items_table: ${run.artifacts_dir}/tables/pseudo_labels.parquet
overrides: {}
