# Run recipe for src/pipelines/write_listening.py
# uses: module recipes merged in (configs/<path>.yaml) · run: this command's own settings
# overrides: changes to the module recipes for this command
# src/launch/make_run_config.py turns this into experiments/<exp>/configs/<name>.yaml; the run reads only that.
uses: [datasets/separation, datasets/instruments, notes/midi, render/render]
run:
  artifacts_dir: ???
  cache_dir: ${run.artifacts_dir}/cache
  tables_dir: ${run.artifacts_dir}/tables
  aligned_midi_dir: ${run.artifacts_dir}/aligned_midi   # labels for every aligned song
  listening_dir: ${run.artifacts_dir}/listening
  clip_seconds: 30
  # Listening clips. parts: list of MusicXML parts, or "all" (the mix of matched stems).
  # start_seconds omitted → the 30 s window with the most note onsets of those parts.
  clips:
    - {name: 01_ensemble_hyeonak_sangnyeongsan, song_id: 0009_정악_풍류음악, parts: all, method: per_song, with_unaligned: true}
    - {name: 02_gayageum_gagok_urong, song_id: 0069_정악_풍류음악, parts: [gayageum], method: per_song}
    - {name: 03_piri_sujecheon, song_id: 0140_정악_궁중음악, parts: [piri], method: per_song}
    - {name: 04_ajaeng_yeominlak, song_id: 0130_정악_궁중음악, parts: [ajaeng], method: per_song}
    - {name: 05_daegeum_gunak_fast, song_id: 0063_정악_풍류음악, parts: [daegeum], method: per_song}
    - {name: 06_geomungo_gyemyeon_garakdodeuri, song_id: 0046_정악_풍류음악, parts: [geomungo], method: per_song}
    - {name: 07_haegeum_bohoeja_transposed, song_id: 0123_정악_궁중음악, parts: [haegeum], method: per_song}
    - {name: 08_worst_gwanak_jungnyeongsan, song_id: 0014_정악_풍류음악, parts: all, method: per_song}
overrides:
  render/render: {fluidsynth_gain: 0.6}
