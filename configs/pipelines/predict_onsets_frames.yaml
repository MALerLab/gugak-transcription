# Run recipe for src/pipelines/predict_onsets_frames.py
# uses: module recipes merged in (configs/<path>.yaml) · run: this command's own settings
# overrides: changes to the module recipes for this command
# src/launch/make_run_config.py turns this into experiments/<exp>/configs/<name>.yaml; the run reads only that.
# Fine-tuned weights: set transcribe.onsets_frames.finetuned_weights_path in the run config.
uses: [transcribe/onsets_frames, datasets/answer_keys, datasets/separation, datasets/instruments]
run:
  artifacts_dir: ???
  device: cuda                    # pick the GPU with CUDA_VISIBLE_DEVICES at launch
  limit_items_per_answer_key: 0   # >0: only the first N items of each answer key (smoke test); 0 = all
  with_solo: true                 # also the solo clips (exp002's test partition)
  six_dragon:
    quality_table: ???            # exp001's alignment_quality_by_song.parquet (usable, split)
    match_table: ???              # exp001's match_table.parquet (stems_with_part)
    midi_dir: ???                 # exp001's aligned_midi/per_stem = the six dragon MIDI
    splits: [val, test]           # frozen split
  solo:
    clips_table: ???              # exp002's solo_clips.parquet
    partition: test               # exp002's dev/test split by piece
    reference_check_table: ???    # exp002's scores for that partition (reference_transposition per clip)
    max_reference_transposition: 1  # larger whole-clip gaps = broken reference (octave errors), left out
  audio_cache_dir: ???            # mono 16 kHz .npy per item, shared across runs
  predictions_dir: ${run.artifacts_dir}/predictions
overrides: {}
