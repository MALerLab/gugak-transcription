# Render MIDI with General MIDI stand-ins and build listening files, used by src/render/render.py
soundfont: ~/storage/gugak-transcription/soundfonts/MuseScore_General.sf2   # MuseScore General (MIT), better than sym8's TimGM6mb
sample_rate: 44100
fluidsynth_gain: 0.5

# write_clip_set (real / render / layered, centred): render scaled to this RMS ratio vs the real audio
layer_render_to_real_rms: 0.8
peak_ceiling: 0.95
target_rms: 0.1          # ≈ −20 dBFS for the real audio of every clip

# write_listening_triplet: stem panned left, render right, at equal loudness (RMS over audible frames)
layer_pan: 0.35          # 0 = both centred, 1 = hard left / right
layer_peak_ceiling: 0.95 # scale the layered mix down if it would clip
