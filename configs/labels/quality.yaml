# Alignment-quality numbers (src/labels/quality.py)

# f0 tracking (YIN) on each stem
yin_window_seconds: 0.046
yin_hop_seconds: 0.01
yin_fmin_hz: 40
yin_fmax_hz: 1600
yin_threshold: 0.15          # CMND dip below this = voiced
# A note's f0 = median over the voiced frames in the middle of the note
note_core_fraction: [0.2, 0.8]
min_note_seconds: 0.15       # shorter notes are skipped for the pitch check
min_voiced_frames: 3
pitch_hit_semitones: 0.5     # |f0 − written pitch (after octave/tuning fix)| below this = hit

# Onsets (spectral flux on a log-magnitude STFT)
onset_window: 2048
onset_hop_seconds: 0.01
onset_median_seconds: 0.5    # adaptive threshold: moving median over this span
onset_delta: 0.05            # … plus this offset (flux is normalised to max 1)
onset_min_gap_seconds: 0.05
onset_tolerance_seconds: 0.1

# Chance level: the same notes shifted in time by these offsets (seconds)
chance_offsets_seconds: [-7.0, -3.0, 3.0, 7.0]
