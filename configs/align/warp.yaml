# Fit MusicXML timing to the stems, used by src/align/warp.py

# Fine locate: redo the subsequence DTW at 10 CENS frames/s around the stage-1 span
refine_feature_rate: 10
refine_cens_smooth_frames: 11
refine_cens_downsample: 1
refine_pad_quarters: 12          # search this far outside the stage-1 span, both ends
refine_tempo_factors: [0.85, 0.92, 1.0, 1.08, 1.17]  # around the stage-1 tempo

# MrMsDTW (synctoolbox), chroma + DLNCO
feature_rate: 50
step_weights: [1.5, 1.5, 2.0]    # (1,0), (0,1), (1,1) — synctoolbox's audio–score example
threshold_rec: 1000000
alpha: 0.5                       # finest level: alpha·chroma cost + (1−alpha)·DLNCO cost
